name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "ruff>=0.6"
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest -q

  smoke:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: Run the Dagster graph on the offline sample
        run: |
          pmtrust run --raw sample_data/raw --lake "$RUNNER_TEMP/lake" \
            --results "$RUNNER_TEMP/results" --config sample_data/config.yaml
      - name: Show the metrics
        run: python -c "import json,sys; m=json.load(open(sys.argv[1])); print(json.dumps(m['windows'], indent=1)[:3000])" "$RUNNER_TEMP/results/metrics.json"
